<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			* {
				margin: 0;
				overflow: hidden;
				height: 100%;
				width: 100%;
			}

			canvas {
				width: 100%;
				height: 100%;
				image-rendering: pixelated;
			}
		</style>
	</head>
	<body>
		<script src="gydra.js"></script>
		<script>
			const ws = new WebSocket("ws://localhost:8080")
			const NUM_LEDS = 16
			const colors = new Array(NUM_LEDS).fill(0).map(() => [0, 0, 0])

			ws.onopen = () => {
				console.log("WebSocket connected")
				// Invia dati al server
				const type = 0 // NeoPixelMessage.GET_CONFIG
				const data = []
				const message = new Uint8Array([type, ...data])
				ws.send(message)

				function getArray(data, components = 4) {
					const len = data.length / components
					const final = new Uint8Array(len * 5)

					for (let i = 0; i < len; i++) {
						const r = data[i * components]
						const g = data[i * components + 1]
						const b = data[i * components + 2]

						final[i * 5] = i
						final[i * 5 + 1] = r
						final[i * 5 + 2] = g
						final[i * 5 + 3] = b
						final[i * 5 + 4] = components === 3 ? Math.max(r, g, b) : data[i * components + 3]
					}

					return final
				}

				function setColor(stripe_index, pixels, components = 4) {
					const data = getArray(pixels, components)
					const type = 2 // NeoPixelMessage.SET_COLOR
					const message = new Uint8Array([stripe_index, type, ...data])

					ws.send(message)
				}

				async function send() {
					gydra.tick()
					const pixels = gydra.defaultOutput.pixels(undefined, false) // risultato di gl.readPixels(0, 0, width, height, this._format, this._type, data)

					const width = gydra.width // Assumi che la larghezza sia accessibile
					const height = gydra.height
					const componentsPerPixel = 4 // RGBW

					// Estrarre colonne per ogni striscia LED
					const stripe_1 = []
					const stripe_2 = []
					const stripe_3 = []

					for (let row = 0; row < height; row++) {
						const baseIndex = row * width * componentsPerPixel

						// Colonna 0
						stripe_1.push(
							pixels[baseIndex], // R
							pixels[baseIndex + 1], // G
							pixels[baseIndex + 2], // B
							pixels[baseIndex + 3] // W
						)

						// Colonna 1
						stripe_2.push(
							pixels[baseIndex + componentsPerPixel], // R
							pixels[baseIndex + componentsPerPixel + 1], // G
							pixels[baseIndex + componentsPerPixel + 2], // B
							pixels[baseIndex + componentsPerPixel + 3] // W
						)

						// Colonna 2
						stripe_3.push(
							pixels[baseIndex + 2 * componentsPerPixel], // R
							pixels[baseIndex + 2 * componentsPerPixel + 1], // G
							pixels[baseIndex + 2 * componentsPerPixel + 2], // B
							pixels[baseIndex + 2 * componentsPerPixel + 3] // W
						)
					}

					setColor(0, stripe_1, componentsPerPixel) // Colonna 0
					setColor(1, stripe_2, componentsPerPixel) // Colonna 1
					setColor(2, stripe_3, componentsPerPixel) // Colonna 2

					requestAnimationFrame(send)
				}

				const gydra = createGydra(NUM_LEDS)

				requestAnimationFrame(send)
			}

			ws.onmessage = event => {
				console.log("Message from server:", event.data)
			}

			ws.onerror = error => {
				console.error("WebSocket error:", error)
			}

			ws.onclose = () => {
				console.log("WebSocket connection closed")
			}

			function createGydra(leds) {
				const gydra = Gydra({
					width: 3,
					height: leds,
					autoTick: false,
				})
				console.log("gydra", gydra)

				gydra.eval(
					//"osc(20, .7).thresh().rotate(-Math.PI / 2).mult(gradient(1)).modulateScale(noise(1, 1).pixelate(1, 1), 10).colorama().saturate(10).out()"
					//"osc(17, .1).thresh().out()"
					`shape(4,[.1, .3], [0, .5].fast(2)).scale(1, 1, .4).translateX(() => cos(time * Math.PI) * 0.5)
                    .translateY(() => cos(time) * 0.5)
                    .mult(solid(() => cos(time), 0, 1))
                    .saturate(1000)
                    .brightness([.01, 0, .01, 0, 0, 0, 0, 0, 0, 0 ,0].fast(1))
                    .out()
                    
                    speed = 3
                    `
				)

				return gydra
			}
		</script>
	</body>
</html>
