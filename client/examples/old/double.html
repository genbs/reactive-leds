<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			* {
				margin: 0;
			}
			canvas {
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<div id="container">
			<input id="ip_1" type="text" placeholder="IP address" value="192.168.1.107" />
			<input id="ip_2" type="text" placeholder="IP address" value="192.168.1.116" />
			<button id="btn_connect">Connect</button>
		</div>

		<canvas></canvas>
		<script src="gydra-led.js"></script>

		<script async>
			function sleep(ms) {
				return new Promise(resolve => setTimeout(resolve, ms))
			}

			const btn = document.querySelector("#btn_connect")
			btn.addEventListener("click", () => {
				const ip1 = document.querySelector("#ip_1").value
				const ip2 = document.querySelector("#ip_2").value

				main(ip1, ip2)
			})

			setTimeout(() => {
				const ip1 = document.querySelector("#ip_1").value
				const ip2 = document.querySelector("#ip_2").value
				main(ip1, ip2)
			})

			async function main(ip1, ip2) {
				console.log("connecting to", ip1, ip2)
				const stripe1 = new GydraLED(ip1)
				await stripe1.init()

				const stripe2 = new GydraLED(ip2)
				await stripe2.init()

				console.log("initted", stripe1, stripe2)

				const config1 = await stripe1.getConfig()
				const config2 = await stripe2.getConfig()

				console.log("config", config1, config2)
				const black = [0, 0, 0, 0]
				const white = [255, 255, 255, 255]

				const stripe1Colors = new Uint8Array(config1.leds * 4).fill(0)
				const stripe2Colors = new Uint8Array(config2.leds * 4).fill(0)

				function clear() {
					for (let i = 0; i < config1.leds; i++) {
						stripe1Colors.set(black, i * 4)
						stripe2Colors.set(black, i * 4)
					}
				}
				let time = 0
				async function animate() {
					clear()

					// Calcola l'indice generale, e il ciclo ping pong tra le strisce

					/*
					const i = Math.floor((time / 500) % (config1.leds * 2))
					const stripe_index = i % 2 === 0 ? 0 : 1
					const led_index = Math.floor(i / 2)

					if (stripe_index === 1) {
						stripe1Colors.set(white, led_index * 4)
					} else {
						stripe2Colors.set(white, led_index * 4)
					}
                    */

					const i = Math.floor(time / 30) % config1.leds
					const led_index = Math.floor(i / 2)

					if (i % 2 === 0) {
						stripe2Colors.set(white, i * 4)
					} else {
						stripe1Colors.set(white, i * 4)
					}

					await stripe1.setColor(stripe1Colors)
					await stripe2.setColor(stripe2Colors)

					time += 1000 / 60

					await sleep(100)

					requestAnimationFrame(animate)
				}

				requestAnimationFrame(animate)
			}
		</script>
	</body>
</html>
