<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			* {
				margin: 0;
				height: 100%;
				width: 100%;
				overflow: hidden;
			}
			canvas {
				width: 100%;
				height: 100%;
			}
		</style>
	</head>
	<body>
		<script src="gydra.js"></script>
		<script src="gydra-led.js"></script>

		<script async>
			function sleep(ms) {
				return new Promise(resolve => setTimeout(resolve, ms))
			}

			async function main() {
				const leds = new GydraLED("192.168.0.8:8889")
				await leds.init()

				const config = await leds.getConfig()
				const gydra = createGydra(config.leds)

				async function send() {
					gydra.tick()
					/*
					const pixels = []

					for (let i = 0; i < config.leds; i++) {
						// Trova l'indice del primo pixel del LED corrente
						const index = Math.floor(i * columnSize) * 4

						// Estrai i valori RGB (ignoriamo il canale alpha)
						const r = canvasPixels[index]
						const g = canvasPixels[index + 1]
						const b = canvasPixels[index + 2]

						pixels.push(r, g, b)
					}

					*/

					await leds.setColor(gydra.defaultOutput.pixels(), 4)

					requestAnimationFrame(send)
				}

				requestAnimationFrame(send)
			}

			function createGydra(leds) {
				const gydra = Gydra({
					width: leds,
					height: 1,
					autoTick: false,
				})
				console.log("gydra", gydra)

				gydra.eval("osc(20, .5).modulatePixelate(src(o0).scale(.99)).thresh().out()")

				return gydra
			}

			main()
		</script>
	</body>
</html>
