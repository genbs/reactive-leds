<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<style>
			* {
				margin: 0;
			}
		</style>
	</head>
	<body>
		<div>Connected: <span id="connected">No</span></div>

		<script src="leds.js"></script>
		<script>
			;(async () => {
				const connectedSpan = document.getElementById("connected")

				try {
					const result = await leds.begin("ws://localhost:8000", false)
					main()

					leds.onConnectionChange(connected => main())

					function main() {
						connectedSpan.textContent = leds.isConnected() ? "Yes" : "No"
					}
				} catch (error) {
					console.error("Error connecting to LED server:", error)
					connectedSpan.textContent = "No"
				}
			})()
		</script>
	</body>
</html>
