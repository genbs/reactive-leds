name: Test cli

on:
  pull_request:
    branches: [master]
    paths:
      - cli/**
      - shared/**
  push:
    branches: [master]
    paths:
      - cli/**
      - shared/**

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - name: Type-check
        run: npx tsc --noEmit -p cli/tsconfig.json
      - run: npm test --workspace=cli
