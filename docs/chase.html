<div class="example-wrap">
	<p class="example-desc" data-i18n="example.chase.desc">Single light chasing across all strips in sequence. Speed controls step interval, Trail sets how many LEDs fade behind.</p>
	<div class="controls">
		<label class="slider">
			<span data-i18n="example.chase.speed">Speed</span>
			<input type="range" id="speed" min="1" max="200" step="1" />
			<span class="slider-value" id="speed-val"></span> ms
		</label>
		<label class="slider">
			<span data-i18n="example.chase.trail">Trail</span>
			<input type="range" id="trail" min="0" max="30" step="1" />
			<span class="slider-value" id="trail-val"></span>
		</label>
	</div>
	<canvas></canvas>
</div>

<script>
	let speed = parseInt(localStorage.getItem("chase-speed") ?? "80")
	let trail = parseInt(localStorage.getItem("chase-trail") ?? "4")

	function initSlider(id, valId, key, value, onChange) {
		const input = document.getElementById(id)
		const val = document.getElementById(valId)
		input.value = val.textContent = value
		input.addEventListener("input", () => {
			val.textContent = input.value
			localStorage.setItem(key, input.value)
			onChange(parseInt(input.value))
		})
	}

	initSlider("speed", "speed-val", "chase-speed", speed, v => speed = v)
	initSlider("trail", "trail-val", "chase-trail", trail, v => trail = v)

	function linearPos(entries, c, r) {
		let pos = r
		for (let i = 0; i < c; i++) pos += entries[i][1].num_leds
		return pos
	}

	let col = 0, row = 0, lastStep = 0, rafId = null
	let canvas, ctx

	function render() {
		const { devices } = window
		const entries = [...devices.entries()]
		if (!entries.length) return

		const total = entries.reduce((s, [, c]) => s + c.num_leds, 0)
		const activeLin = linearPos(entries, col, row)
		const colors = new Map()

		entries.forEach(([ip, config], c) => {
			const hue = (c / entries.length) * 360
			const [r, g, b] = window.hslToRgb(hue, 100, 50)
			const leds = []
			for (let i = 0; i < config.num_leds; i++) {
				const dist = (activeLin - linearPos(entries, c, i) + total) % total
				const br = dist === 0 ? 1 : dist <= trail ? 1 - dist / (trail + 1) : 0
				leds.push(br > 0 ? [Math.round(r * br), Math.round(g * br), Math.round(b * br), 0] : [0, 0, 0, 0])
			}
			colors.set(ip, leds)
		})

		ctx.clearRect(0, 0, canvas.width, canvas.height)
		window.drawStrips(ctx, devices, colors)
		window.sendLEDs(devices, colors)
	}

	function loop(now) {
		if (!window.devices.size) { rafId = requestAnimationFrame(loop); return }
		if (now - lastStep >= speed) {
			const entries = [...window.devices.entries()]
			row = row + 1 >= entries[col][1].num_leds ? ((col = (col + 1) % entries.length), 0) : row + 1
			render()
			lastStep = now
		}
		rafId = requestAnimationFrame(loop)
	}

	function main() {
		canvas = document.querySelector("canvas")
		ctx = canvas.getContext("2d")
		const size = window.stripsCanvasSize(window.devices, canvas.parentElement)
		canvas.width = size.width
		canvas.height = size.height
		col = row = lastStep = 0
		if (rafId) cancelAnimationFrame(rafId)
		render()
		rafId = requestAnimationFrame(loop)
	}

	window.main = main
	window.example_cleanup = () => cancelAnimationFrame(rafId)
</script>
