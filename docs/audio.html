<div class="example-wrap">
	<p class="example-desc" data-i18n="example.audio.desc">
		Microphone input mapped to LED strips via logarithmic frequency bands. Each strip reacts to a different part of the
		spectrum.
	</p>
	<div class="controls">
		<label class="slider">
			<span data-i18n="example.audio.sensitivity">Sensitivity</span>
			<input type="range" id="sensitivity" min="0.1" max="2" step="0.05" />
			<span class="slider-value" id="sensitivity-val"></span>
		</label>
	</div>
	<canvas></canvas>
</div>

<script>
	const SPEC_H = 120,
		BAR_H = 32

	let sensitivity = parseFloat(localStorage.getItem("audio-sensitivity") ?? "0.5")
	const sensInput = document.getElementById("sensitivity")
	const sensVal = document.getElementById("sensitivity-val")
	sensInput.value = sensitivity
	sensVal.textContent = sensitivity + "×"
	sensInput.addEventListener("input", () => {
		sensitivity = parseFloat(sensInput.value)
		sensVal.textContent = sensitivity + "×"
		localStorage.setItem("audio-sensitivity", sensitivity)
	})

	function bandRange(c, N, bins) {
		const usable = Math.floor(bins * 0.75)
		const lo = Math.round(Math.pow(usable, c / N))
		const hi = Math.round(Math.pow(usable, (c + 1) / N))
		return [lo, Math.max(hi, lo + 1)]
	}

	function bandAmplitude(data, lo, hi) {
		let max = 0
		for (let i = lo; i < hi; i++) if (data[i] > max) max = data[i]
		return Math.min(1, (max / 255) * sensitivity)
	}

	let analyser = null,
		dataArray = null,
		micStream = null,
		audioCtx = null

	async function startAudio() {
		if (analyser) return
		try {
			micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false })
			audioCtx = new AudioContext()
			const source = audioCtx.createMediaStreamSource(micStream)
			analyser = audioCtx.createAnalyser()
			analyser.fftSize = 256
			analyser.smoothingTimeConstant = 0.75
			source.connect(analyser)
			dataArray = new Uint8Array(analyser.frequencyBinCount)
		} catch {
			specCtx.fillStyle = "#888"
			specCtx.font = "14px system-ui"
			specCtx.fillText("Microphone permission denied", window.STRIP_PAD, window.STRIP_PAD + 20)
		}
	}

	// release the microphone (and the browser's mic indicator) when the example
	// is switched away or the dialog closes; main() re-acquires it on reopen.
	function stopAudio() {
		micStream?.getTracks().forEach(t => t.stop())
		audioCtx?.close()
		micStream = audioCtx = analyser = dataArray = null
	}

	let rafId = null
	let specCanvas, specCtx

	function render() {
		const { devices } = window
		const entries = [...devices.entries()]
		if (!entries.length || !analyser) return

		analyser.getByteFrequencyData(dataArray)
		const bins = dataArray.length
		const bw = (specCanvas.width - window.STRIP_PAD * 2) / bins

		// spectrum (own canvas)
		specCtx.clearRect(0, 0, specCanvas.width, specCanvas.height)
		for (let i = 0; i < bins; i++) {
			const amp = Math.min(1, (dataArray[i] / 255) * sensitivity)
			const c = entries.findIndex((_, idx) => {
				const [lo, hi] = bandRange(idx, entries.length, bins)
				return i >= lo && i < hi
			})
			const hue = c >= 0 ? (c / entries.length) * 360 : 0
			specCtx.fillStyle = `hsl(${hue},100%,50%)`
			specCtx.fillRect(window.STRIP_PAD + i * bw, window.STRIP_PAD + SPEC_H - amp * SPEC_H, bw - 1, amp * SPEC_H)
		}

		// strips (shared preview)
		const colors = new Map()
		entries.forEach(([ip, config], c) => {
			const hue = (c / entries.length) * 360
			const [r, g, b] = window.hslToRgb(hue, 100, 50)
			const [lo, hi] = bandRange(c, entries.length, bins)
			const amp = bandAmplitude(dataArray, lo, hi)
			const lit = Math.round(amp * config.num_leds)
			const leds = []
			for (let i = 0; i < config.num_leds; i++) leds.push(i < lit ? [r, g, b, 0] : [0, 0, 0, 0])
			colors.set(ip, leds)
		})

		window.previewCtx.clearRect(0, 0, window.previewCanvas.width, window.previewCanvas.height)
		window.drawStrips(window.previewCtx, devices, colors)
	}

	function loop() {
		render()
		rafId = requestAnimationFrame(loop)
	}

	async function main() {
		specCanvas = document.querySelector("#example-container canvas")
		specCtx = specCanvas.getContext("2d")
		specCanvas.width = specCanvas.parentElement.clientWidth
		specCanvas.height = window.STRIP_PAD * 2 + SPEC_H
		window.fitPreview()
		if (rafId) cancelAnimationFrame(rafId)
		await startAudio()
		rafId = requestAnimationFrame(loop)
	}

	window.main = main
	window.example_cleanup = () => {
		cancelAnimationFrame(rafId)
		stopAudio()
	}
</script>
