<div class="example-wrap">
	<p class="example-desc" data-i18n="example.color.desc">Set RGBW color for all connected strips simultaneously. W adds white to the mix.</p>
	<div class="slides-layout">
		<div class="controls-v">
			<label class="slider">R <input type="range" id="leds_r" min="0" max="255" value="0" /> <span class="slider-value" id="val_r">0</span></label>
			<label class="slider">G <input type="range" id="leds_g" min="0" max="255" value="0" /> <span class="slider-value" id="val_g">0</span></label>
			<label class="slider">B <input type="range" id="leds_b" min="0" max="255" value="0" /> <span class="slider-value" id="val_b">0</span></label>
			<label class="slider">W <input type="range" id="leds_w" min="0" max="255" value="0" /> <span class="slider-value" id="val_w">0</span></label>
		</div>
		<div class="color-swatch" id="color-swatch"></div>
	</div>
</div>

<script>
	function main() {
		const { devices } = window
		const channels = ["r", "g", "b", "w"]
		const inputs = Object.fromEntries(channels.map(ch => [ch, document.getElementById("leds_" + ch)]))
		const vals = Object.fromEntries(channels.map(ch => [ch, document.getElementById("val_" + ch)]))
		const swatch = document.getElementById("color-swatch")
		const ctx = window.fitPreview()

		const saved = JSON.parse(localStorage.getItem("leds") || "{}")
		for (const ch of channels) {
			if (saved[ch] !== undefined) inputs[ch].value = saved[ch]
			vals[ch].textContent = inputs[ch].value
		}

		function updateLeds() {
			const rgbw = channels.map(ch => parseInt(inputs[ch].value))
			channels.forEach((ch, i) => (vals[ch].textContent = rgbw[i]))

			const [r, g, b, w] = rgbw
			const mix = w / 255
			const [sr, sg, sb] = [r, g, b].map(c => Math.round(c + (255 - c) * mix))
			swatch.style.background = `rgb(${sr},${sg},${sb})`
			swatch.style.boxShadow = sr + sg + sb > 0 ? `0 0 2rem rgba(${sr},${sg},${sb},0.4)` : "none"

			const colors = new Map(
				[...devices.entries()].map(([ip, config]) => [ip, Array.from({ length: config.num_leds }, () => rgbw)])
			)

			ctx.clearRect(0, 0, window.previewCanvas.width, window.previewCanvas.height)
			window.drawStrips(ctx, devices, colors)

			localStorage.setItem("leds", JSON.stringify({ r, g, b, w }))
		}

		for (const ch of channels) inputs[ch].addEventListener("input", updateLeds)
		updateLeds()
	}
	window.main = main
</script>
